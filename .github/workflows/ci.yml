name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CLI smoke test
        run: |
          PYTHONPATH=src python3 -m governance_sandbox.cli run \
            --proposal "Test proposal" \
            --stakeholders "core contributors,token holders"
