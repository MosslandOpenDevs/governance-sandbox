name: CI

on:
  push:
  pull_request:

# Least-privilege by default; jobs only need to read the repo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Some tests spawn a bare `python3` with a stripped environment, which on
      # the runner resolves to the system interpreter. Give it PyYAML so those
      # subprocess tests can load YAML scenarios.
      - name: Provision system PyYAML (for subprocess tests)
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q
        env:
          PYTHONPATH: src

      - name: Build sdist and wheel
        run: python -m build

      - name: Check README/doc links
        run: python scripts/check_links.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: CLI smoke test
        run: |
          gov-sandbox run \
            --proposal "Test proposal" \
            --stakeholders "core contributors,token holders"
