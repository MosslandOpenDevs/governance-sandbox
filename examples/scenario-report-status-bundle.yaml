name: Treasury guardrail rehearsal
context: Prepare a DAO vote on shifting budget toward growth without losing contributor trust.
proposal:
  title: Shift part of the treasury budget toward growth experiments
  summary: Reallocate 15% of next quarter's grants budget into time-boxed acquisition campaigns with rollback checkpoints.
  points:
    - Keep the pilot limited to one quarter
    - Publish weekly spend and conversion snapshots
    - Restore the budget mix if targets are missed
stakeholders:
  - name: Governance delegates
    preset: delegates
  - name: Core contributors
    preset: contributors
  - name: Community stewards
    preset: community
report:
  title: Treasury guardrail rehearsal memo
  owner: Governance working group
  audience:
    - DAO delegates
    - Operations leads
  output_name: treasury-guardrail-rehearsal
